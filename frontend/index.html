<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Chatbot</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #app {
            width: 100%;
            max-width: 720px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            overflow: hidden;
        }
        header {
            background: #1a73e8;
            color: #ffffff;
            padding: 16px 24px;
            flex-shrink: 0;
        }
        header h1 {
            font-size: 1.2rem;
            font-weight: 600;
        }
        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .message.user {
            background: #1a73e8;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.bot {
            background: #f1f3f4;
            color: #202124;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        #input-area {
            display: flex;
            gap: 8px;
            padding: 16px 24px;
            border-top: 1px solid #e0e0e0;
            flex-shrink: 0;
            background: #ffffff;
        }
        #user-input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #dadce0;
            border-radius: 24px;
            font-size: 0.95rem;
            outline: none;
        }
        #user-input:focus {
            border-color: #1a73e8;
        }
        #send-btn {
            padding: 10px 22px;
            background: #1a73e8;
            color: #ffffff;
            border: none;
            border-radius: 24px;
            font-size: 0.95rem;
            cursor: pointer;
            flex-shrink: 0;
        }
        #send-btn:hover {
            background: #1557b0;
        }
        #send-btn:disabled {
            background: #a8c7fa;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>Financial Assistant</h1>
        </header>
        <div id="chat-window"></div>
        <div id="input-area">
            <input type="text" id="user-input"
                   placeholder="Ask me about finance or request a calculation..."
                   autocomplete="off" />
            <button id="send-btn">Send</button>
        </div>
    </div>
    <script>
        var API_URL    = "http://localhost:5000/chat";
        var SESSION_ID = "sess-" + Math.random().toString(36).slice(2, 11);

        var chatWindow = document.getElementById("chat-window");
        var userInput  = document.getElementById("user-input");
        var sendBtn    = document.getElementById("send-btn");

        function addMessage(text, role) {
            var div = document.createElement("div");
            div.className = "message " + role;
            div.textContent = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function sendMessage() {
            var text = userInput.value.trim();
            if (text === "") {
                return;
            }
            addMessage(text, "user");
            userInput.value = "";
            sendBtn.disabled = true;
            sendBtn.textContent = "...";
            fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: text, session_id: SESSION_ID })
            })
            .then(function(response) { return response.json(); })
            .then(function(data) {
                var reply = data.reply || data.error || "No response received.";
                addMessage(reply, "bot");
            })
            .catch(function(err) {
                addMessage("Connection error. Is the server running?", "bot");
            })
            .finally(function() {
                sendBtn.disabled = false;
                sendBtn.textContent = "Send";
                userInput.focus();
            });
        }

        sendBtn.addEventListener("click", sendMessage);
        userInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });

        addMessage("Hi! I'm your financial assistant. I can help with finance questions and calculate:\n\n1. Loan Tenure\n2. SIP for a target amount\n3. SWP (Systematic Withdrawal Plan)\n\nType your question or say something like 'calculate loan tenure' to get started!", "bot");
    </script>
</body>
</html>
